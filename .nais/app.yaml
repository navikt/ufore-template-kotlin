apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: ufore-XXX
  namespace: ufore
  labels:
    team: ufore
spec:
  env:
    - name: COMMON
      value: value
  azure:
    application:
      enabled: true
  liveness:
    path: actuator/health/liveness
    initialDelay: 30
  readiness:
    path: actuator/health/readiness
    initialDelay: 30
  startup:
    path: actuator/health/readiness
    initialDelay: 30
    failureThreshold: 30
    periodSeconds: 5
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  prometheus:
    enabled: true
    path: actuator/prometheus
  secureLogs:
    enabled: true
