name: Apply alerts

on:
  push:
    branches:
      - main
    paths:
      - 'apply-alerts.yml'
      - 'alerts/**'

jobs:
  apply-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef
        env:
          CLUSTER: prod-gcp
          RESOURCE: alerts/alert-manager-config.yaml,alerts/alerts.yaml
