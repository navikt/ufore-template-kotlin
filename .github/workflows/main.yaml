name: Build and deploy
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build application jar
        run: ./gradlew --no-daemon build
      - name: Build and push image and SBOM to OCI registry
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f
        id: docker-build-push
        with:
          team: ufore

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf
        with:
          team: ufore
      - name: Deploy to dev-gcp
        if: ${{ false }} # fjern denne raden når du vil deploye til dev-gcp
        run: |
          nais apply .nais/app.yaml \
            --environment dev-gcp \
            --set spec.image="${{ needs.build.outputs.image }}" \
            --wait
      - name: Deploy to prod-gcp
        if: ${{ false }} # fjern denne raden når du vil deploye til prod-gcp
        run: |
          nais apply .nais/app.yaml \
            --environment prod-gcp \
            --set spec.image="${{ needs.build.outputs.image }}" \
            --wait
